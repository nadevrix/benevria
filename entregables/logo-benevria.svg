<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="BenevrIA">
  <title>BenevrIA</title>
  <desc>Cuatro barras ascendentes: los cuatro niveles de modelo que la comunidad desbloquea al enseñar.</desc>

  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
  </defs>

  <!-- Las cuatro barras son los cuatro niveles: Base, Bronce, Plata y Oro.
       La altura crece porque el nivel lo levanta la comunidad enseñando. -->
  <g fill="url(#g)">
    <rect x="56"  y="328" width="76" height="120" rx="26"/>
    <rect x="168" y="248" width="76" height="200" rx="26"/>
    <rect x="280" y="160" width="76" height="288" rx="26"/>
    <rect x="392" y="72"  width="76" height="376" rx="26"/>
  </g>

  <!-- El punto sobre la barra más alta: el conocimiento que todavía falta aportar. -->
  <circle cx="430" cy="30" r="18" fill="#F472B6" opacity="0.55"/>
</svg>
